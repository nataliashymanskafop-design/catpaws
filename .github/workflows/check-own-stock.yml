name: Check own SalesDrive stock export

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check SKU ЗС000294 in SalesDrive YML
        env:
          SALESDRIVE_API_KEY: ${{ secrets.SALESDRIVE_API_KEY }}
          SALESDRIVE_PRODUCTS_YML_URL: ${{ secrets.SALESDRIVE_PRODUCTS_YML_URL }}
        run: |
          python - <<'PY'
          import os

          import requests
          from lxml import etree

          from scripts.generate_home_food_stock import (
              ORDER_LIST_URL,
              api_json,
          )

          response = requests.get(
              os.environ["SALESDRIVE_PRODUCTS_YML_URL"],
              timeout=120,
          )
          response.raise_for_status()
          root = etree.fromstring(response.content)
          offers = root.xpath(".//offer")
          print(f"SalesDrive YML offers: {len(offers)}")

          matches = []
          for offer in offers:
              values = {
                  str(node.text or "").strip()
                  for node in offer.iter()
              }
              if any(target in value for target in ("ЗС000294", "1038100") for value in values):
                  matches.append(offer)

          print(f"YML matches for ЗС000294: {len(matches)}")
          for offer in matches[:3]:
              print(f"YML offer_id={offer.get('id')}")
              for child in offer:
                  if child.tag == "description":
                      continue
                  value = " ".join(str(child.text or "").split())
                  print(
                      f"YML {child.tag} "
                      f"attrs={dict(child.attrib)} value={value[:160]}"
                  )

          result = api_json(
              ORDER_LIST_URL,
              os.environ["SALESDRIVE_API_KEY"],
              params={
                  "page": 1,
                  "limit": 10,
                  "filter[id][from]": 2695,
                  "filter[id][to]": 2695,
              },
          )
          orders = result.get("data") or []
          for order in orders:
              if int(order.get("id") or 0) != 2695:
                  continue
              print("Order 2695 found")
              for item in order.get("products") or []:
                  print(
                      "ORDER_ITEM "
                      f"id={item.get('id')} "
                      f"productId={item.get('productId')} "
                      f"sku={item.get('sku')} "
                      f"stockId={item.get('stockId')} "
                      f"restCount={item.get('restCount')}"
                  )
              break
          else:
              raise RuntimeError("Order 2695 not found")
          PY
