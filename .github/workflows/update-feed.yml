name: Generate Mono, Prom, HOME FOOD, Kormax and DOMS Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Забираємо попередній прайс Mono.
      # Він потрібен, щоб зберегти старий updatedAt,
      # якщо фактичні залишки не змінилися.
      - name: Download previous Mono offers
        continue-on-error: true
        run: |
          curl -fL \
            "https://nataliashymanskafop-design.github.io/catpaws/offers-response.json" \
            -o previous-offers-response.json

      - name: Generate Mono offers
        run: python scripts/generate_feed.py

      - name: Generate Mono products
        run: python scripts/generate_products_feed.py

      # Забираємо журнал попередньої синхронізації HOME FOOD.
      # Він потрібен, щоб кожне замовлення враховувалося лише один раз.
      - name: Download previous HOME FOOD stock state
        continue-on-error: true
        run: |
          mkdir -p public
          curl -fL \
            "https://nataliashymanskafop-design.github.io/catpaws/home-food-stock-state.json" \
            -o public/home-food-stock-state.json

      # Синхронізуємо залишки HOME FOOD із SalesDrive
      # та формуємо резервний YML.
      # Помилка цього кроку не повинна зупиняти Mono та Prom.
      - name: Generate HOME FOOD stock feed
        continue-on-error: true
        env:
          SALESDRIVE_API_KEY: ${{ secrets.SALESDRIVE_API_KEY }}
          SALESDRIVE_HOME_FOOD_STOCK_ID: ${{ vars.SALESDRIVE_HOME_FOOD_STOCK_ID }}
        run: python scripts/generate_home_food_stock.py

      # Забираємо журнал попередньої синхронізації складу Білогородка.
      # Він потрібен, щоб замовлення не списували залишки повторно.
      - name: Download previous Kormax stock state
        continue-on-error: true
        run: |
          mkdir -p public
          curl -fL \
            "https://nataliashymanskafop-design.github.io/catpaws/kormax-stock-state.json" \
            -o public/kormax-stock-state.json

      # Синхронізуємо склад Kormax — Білогородка із SalesDrive
      # та формуємо резервний YML.
      # Помилка цього кроку не повинна зупиняти Mono та Prom.
      - name: Generate Kormax stock feed
        continue-on-error: true
        env:
          SALESDRIVE_API_KEY: ${{ secrets.SALESDRIVE_API_KEY }}
          SALESDRIVE_KORMAX_STOCK_ID: ${{ vars.SALESDRIVE_KORMAX_STOCK_ID }}
        run: python scripts/generate_kormax_stock.py

      # Забираємо журнал попередньої синхронізації складу Святопетрівське.
      # Він потрібен, щоб замовлення не списували залишки повторно.
      - name: Download previous DOMS stock state
        continue-on-error: true
        run: |
          mkdir -p public
          curl -fL \
            "https://nataliashymanskafop-design.github.io/catpaws/doms-stock-state.json" \
            -o public/doms-stock-state.json

      # Синхронізуємо склад ДОМС-ТРЕЙД — Святопетрівське із SalesDrive
      # та формуємо резервний YML.
      # Помилка цього кроку не повинна зупиняти Mono та Prom.
      - name: Generate DOMS stock feed
        continue-on-error: true
        env:
          SALESDRIVE_API_KEY: ${{ secrets.SALESDRIVE_API_KEY }}
          SALESDRIVE_DOMS_STOCK_ID: ${{ vars.SALESDRIVE_DOMS_STOCK_ID }}
        run: python scripts/generate_doms_stock.py

      # Перевіряємо доступ до Prom API.
      - name: Test Prom API
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
        run: python scripts/test_prom_api.py

      # Формуємо XML для оновлення товарів Prom.
      - name: Generate Prom update feed
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
        run: python scripts/generate_prom_update_feed.py

      # Публікуємо готові фіди на GitHub Pages.
      - name: Publish all feeds
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
