name: Synchronize Prom availability, prices and promotions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_prom_update_feed.py
      - scripts/test_prom_sync.py
      - scripts/generate_feed.py
      - .github/workflows/prom-sync.yml
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: prom-product-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Test promotion and availability synchronization
        run: python -m unittest discover -s scripts -p test_prom_sync.py
      - name: Synchronize and verify actual Prom states
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
        run: python scripts/generate_prom_update_feed.py
